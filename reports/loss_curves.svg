<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif">
<style>
	.bg { fill: #fcfcfb; }
	.title { fill: #0b0b0b; font-size: 15px; font-weight: 600; }
	.sub { fill: #52514e; font-size: 11.5px; }
	.grid, .axis { stroke: #e4e3de; stroke-width: 1; }
	.rule { stroke: #78766f; stroke-width: 1; stroke-dasharray: 3 3; opacity: .7; }
	.rule-label { fill: #78766f; font-size: 10.5px; }
	.tick { fill: #52514e; font-size: 11px; }
	.axis-label { fill: #78766f; font-size: 11px; }
	.line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
	.dot { stroke: #fcfcfb; stroke-width: 2; }
	/* hollow, so two val points at nearly the same loss stay separable */
	.val { fill: #fcfcfb; stroke-width: 2.5; }
	.end-label { fill: #0b0b0b; font-size: 12px; }
	.line.s1, .val.s1 { stroke: #2a78d6; } .dot.s1 { fill: #2a78d6; }
	.line.s2, .val.s2 { stroke: #eb6834; } .dot.s2 { fill: #eb6834; }
	.line.s3, .val.s3 { stroke: #1baf7a; } .dot.s3 { fill: #1baf7a; }
	@media (prefers-color-scheme: dark) {
		.bg { fill: #1a1a19; }
		.title, .end-label { fill: #f0efec; }
		.sub, .tick { fill: #c3c2b7; }
		.grid, .axis { stroke: #343431; }
		.rule, .rule-label, .axis-label { stroke: #9a988e; fill: #9a988e; }
		.dot { stroke: #1a1a19; }
		.val { fill: #1a1a19; }
		.line.s1, .val.s1 { stroke: #3987e5; } .dot.s1 { fill: #3987e5; }
		.line.s2, .val.s2 { stroke: #d95926; } .dot.s2 { fill: #d95926; }
		.line.s3, .val.s3 { stroke: #199e70; } .dot.s3 { fill: #199e70; }
	}
</style>
